name: Test

on:
  workflow_call:
    inputs:
      version:
        description: halfcraft's version (tools/version.ps1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  minecraft:
    name: Minecraft mod
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      HALFCRAFT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JDK 25
        shell: powershell
        run: ./.github/scripts/pinned.ps1 jdk
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Build and test
        shell: powershell
        run: ./tools/gradle.ps1 build
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minecraft-reports
          path: minecraft/build/reports
          retention-days: 7
