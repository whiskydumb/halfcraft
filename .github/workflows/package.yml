name: Package

on:
  workflow_call:
    inputs:
      version:
        description: halfcraft's version (tools/version.ps1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows zip
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      HALFCRAFT_VERSION: ${{ inputs.version }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JDK 25
        shell: powershell
        run: ./.github/scripts/pinned.ps1 jdk
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: SDK trees
        shell: powershell
        run: ./tools/setup_sdk.ps1
      - name: Minecraft mod
        shell: powershell
        run: ./tools/gradle.ps1 assemble
      - name: Half-Life side
        shell: powershell
        run: ./tools/build_hl2.ps1
      - name: Zip
        shell: powershell
        run: ./tools/package.ps1 -NoBuild
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halfcraft-${{ inputs.version }}
          path: dist/HalfCraft-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
