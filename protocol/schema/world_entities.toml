title = "world entities"
doc = """
Minecraft things the host draws itself each frame (arrows, dropped items, block cracks) + the
block outline."""

[regions.WorldEntities]
at = 0x1E000
type = "WorldEntities"
doc = "MC -> host, seqlock"

[constants]
kMaxWorldEntities = { type = "u32", value = 160 }

[enums.WorldEntityKind]
type = "u32"

[enums.WorldEntityKind.items]
kWeArrow = { value = 1, doc = "uv[0]: the arrow's item icon" }
kWeItem = { value = 2, doc = "dropped/thrown item: a flat sprite (uv[0]) turning about the vertical" }
kWeTrident = { value = 3, doc = "uv[0]: the trident's item icon" }
kWeBlock = { value = 4, doc = "dropped block item: a spinning cube of side `scale`, uv[0..2] = side, top, bottom" }
kWeCrack = { value = 5, doc = "block-breaking cracks over the box at (x, y, z) of size ext, uv[0] = crack stage" }
kWeShadow = { value = 6, doc = "a player's or mob's feet at (x, y, z), `scale` wide: its soft contact shadow" }
kWeHeldBlock = { value = 7, doc = """
a block the host's gravity gun tore out (kInTakeBlock): id = its held slot, uv[0..2] = side,
top, bottom, tint as kWeBlock's. The host draws it on its own physics body (x/y/z unused)""" }

[structs.WorldEntity]
size = 96

[structs.WorldEntity.fields]
kind = { type = "u32", doc = "WorldEntityKind" }
id = { type = "u32", doc = "MC entity id (stable while it exists)" }
"x, y, z" = { type = "f32", doc = "MC coords (interpolated at MC's render time)" }
"yaw, pitch" = { type = "f32", doc = "MC degrees" }
scale = "f32"
ext = { type = "f32[3]", doc = "kWeCrack: box size" }
uv = { type = "f32[3][4]", doc = "atlas rects {u0, v0, u1, v1}" }
tint = { type = "u32", doc = "RGBA8 multiplier for the top face (grass, leaves); 0 = none" }

[structs.WorldEntities]
java = "WE"

[structs.WorldEntities.fields]
seq = "u32"
count = "u32"
hasSelection = { type = "u32", doc = "draw an outline around the targeted block" }
"selMin, selMax" = { type = "f32[3]", doc = "MC coords" }
pad = "u8[0x40 - 36]"
entities = { type = "WorldEntity[kMaxWorldEntities]", java = "WE_RECORDS" }
