// the game rules run this on every map: half-life 2's skill values (skill.cfg, hl2dm-sp's copy of
// valve's). server.dll adds skill_ep1.cfg or skill_ep2.cfg on the episodes' maps (hc_campaign.cpp)
exec skill.cfg

// valve's current skill.cfg adds these. the episodic dlls' defaults are the episodes': 2.0 where
// half-life 2's hard skill takes 1.5 times the damage, and a strider minigun that does 5 to npcs, not
// half-life 2's 15 (its striders would hardly hurt the citizens of d3_c17_12 and 13)
sk_dmg_take_scale3 1.50
sk_npc_dmg_strider_to_plr 5
sk_npc_dmg_strider 15
sk_max_strider 15
